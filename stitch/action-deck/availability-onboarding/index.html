<style>
        .slot-active {
            background-color: #004c22 !important;
            color: #ffffff !important;
            border-color: #004c22 !important;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #004c22;
            cursor: pointer;
            margin-top: -10px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #bfc9bd;
            border-radius: 2px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background text-on-background flat no shadows flex justify-between items-center px-margin-mobile py-sm z-50">
<div class="flex items-center gap-sm">
<button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<h1 class="font-headline-md text-headline-md text-primary">Availability</h1>
<div class="w-11 h-11 flex items-center justify-center">
<span class="font-label-bold text-label-bold text-outline">3 of 3</span>
</div>
</header>
<main class="flex-grow px-margin-mobile pb-[100px] pt-md md:px-lg max-w-2xl mx-auto w-full">
<div class="mb-xl">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-xs">When are you free?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Tap the slots that work best for your regular walks.</p>
</div>
<!-- Weekly Grid -->
<section class="mb-xl">
<div class="grid grid-cols-[auto_1fr_1fr_1fr] gap-xs sm:gap-sm bg-surface-container p-sm rounded-xl">
<!-- Headers -->
<div></div>
<div class="text-center font-label-sm text-label-sm text-on-surface-variant pb-xs">Morn</div>
<div class="text-center font-label-sm text-label-sm text-on-surface-variant pb-xs">Aft</div>
<div class="text-center font-label-sm text-label-sm text-on-surface-variant pb-xs">Eve</div>
<!-- Monday -->
<div class="flex items-center justify-end pr-sm font-label-bold text-label-bold text-on-surface">Mon</div>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm"></button>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm slot-active"></button>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm"></button>

<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm"></button>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm"></button>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm"></button>

<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm slot-active"></button>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm"></button>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm slot-active"></button>
<!-- Thursday -->

<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm"></button>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm"></button>

<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm slot-active"></button>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm"></button>

<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm"></button>

<div class="flex items-center justify-end pr-sm font-label-bold text-label-bold text-on-surface">Sun</div>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm slot-active"></button>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm slot-active"></button>
<button class="slot-btn h-12 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors font-label-sm text-label-sm slot-active"></button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-sm text-center">Tap a slot to toggle availability.</p>
</section>
<!-- Travel Distance Slider -->
<section class="bg-surface-container-low p-md rounded-xl border border-surface-variant">
<div class="flex justify-between items-center mb-md">
<h3 class="font-headline-md text-headline-md text-on-surface">How far will you travel?</h3>
<span class="font-label-bold text-label-bold text-primary bg-primary-container/10 px-sm py-xs rounded-full" id="sliderValue">20 mins</span>
</div>
<input class="w-full appearance-none bg-transparent" id="travelSlider" max="60" min="5" step="5" type="range" value="20"/>
<div class="flex justify-between mt-sm font-label-sm text-label-sm text-outline">
<span>5m</span>
<span>60m</span>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full bg-surface border-t border-surface-variant px-margin-mobile py-md pb-safe z-40 flex justify-center">
<button class="w-full max-w-2xl bg-primary text-on-primary font-label-bold text-label-bold h-12 rounded-full flex items-center justify-center hover:opacity-90 transition-opacity shadow-sm active:scale-95 duration-100">
            Finish
        </button>
</div>
<script>
        // Slot toggling
        document.querySelectorAll('.slot-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.toggle('slot-active');
            });
        });

        // Slider value update
        const slider = document.getElementById('travelSlider');
        const output = document.getElementById('sliderValue');
        slider.oninput = function() {
            output.innerHTML = this.value + ' mins';
        }
    </script>
</body></html>
