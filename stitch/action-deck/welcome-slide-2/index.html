<style type="text/tailwindcss">
        @layer utilities {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
            .material-symbols-outlined.fill {
                font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
            
            /* Custom Animation for the abstract visual */
            @keyframes pulse-ring {
                0% { transform: scale(0.95); opacity: 0.5; }
                50% { transform: scale(1.05); opacity: 0.8; }
                100% { transform: scale(0.95); opacity: 0.5; }
            }
            .animate-pulse-ring {
                animation: pulse-ring 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            
            @keyframes morph-shape {
                0% { border-radius: 4px; width: 80%; }
                50% { border-radius: 16px; width: 100%; height: 120px; }
                100% { border-radius: 4px; width: 80%; }
            }
            .animate-morph {
                animation: morph-shape 6s ease-in-out infinite;
            }
        }
    </style>

<body class="bg-surface h-full w-full flex flex-col font-body-md text-on-surface overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar - Simple back/skip for onboarding flow -->
<header class="w-full flex justify-between items-center px-margin-mobile py-lg sticky top-0 bg-surface z-10">
<button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95 text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span aria-label="Go back" class="material-symbols-outlined">arrow_back</span>
</button>
<button class="font-label-bold text-label-bold text-outline hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded-DEFAULT px-2 py-1">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile md:px-xl max-w-2xl mx-auto w-full relative z-0">
<!-- Abstract Visual Area -->
<div class="flex-1 min-h-[300px] flex items-center justify-center relative my-xl">
<!-- Decorative background elements -->
<div class="absolute w-64 h-64 bg-primary-fixed opacity-20 rounded-full blur-3xl animate-pulse-ring"></div>
<div class="absolute w-48 h-48 bg-secondary-fixed opacity-30 rounded-full blur-2xl animate-pulse-ring" style="animation-delay: 2s; right: 10%; top: 20%;"></div>
<!-- Abstract Morphing Element (Input to Card) -->
<div class="relative w-full max-w-sm h-48 flex items-center justify-center z-10">
<!-- The "Input Field" representation morphing into a "Card" -->
<div class="bg-surface-container-lowest shadow-[0_8px_24px_rgba(0,0,0,0.06)] border border-surface-dim h-16 animate-morph flex flex-col justify-center px-lg overflow-hidden relative">
<!-- Fake text cursor -->
<div class="w-0.5 h-6 bg-primary absolute left-lg top-1/2 -translate-y-1/2 animate-[pulse_1s_infinite]"></div>
<!-- Abstract text lines that appear when expanded -->
<div class="space-y-3 opacity-0 transition-opacity duration-1000 delay-500 w-full" id="card-content">
<div class="h-4 bg-surface-variant rounded-full w-3/4"></div>
<div class="h-3 bg-surface-variant rounded-full w-1/2"></div>
<div class="flex gap-2 mt-4 pt-2">
<div class="h-6 w-16 bg-primary-fixed-dim rounded-full"></div>
<div class="h-6 w-16 bg-secondary-fixed rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- Floating icons for context -->
<div class="absolute top-1/4 left-1/4 w-12 h-12 bg-surface-container-lowest rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.08)] flex items-center justify-center text-primary animate-[bounce_3s_infinite]">
<span class="material-symbols-outlined fill">directions_walk</span>
</div>
<div class="absolute bottom-1/3 right-1/4 w-10 h-10 bg-surface-container-lowest rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.08)] flex items-center justify-center text-secondary animate-[bounce_4s_infinite_0.5s]">
<span class="material-symbols-outlined fill">group</span>
</div>
</div>
<!-- Typography & Storytelling -->
<div class="flex flex-col gap-sm pb-xl text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">
                Join something, or start your own.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto md:mx-0">
                Describe an activity in your own words and the app finds people for it.
            </p>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="w-full px-margin-mobile md:px-xl pb-margin-mobile pt-md bg-surface border-t border-surface-container">
<div class="max-w-2xl mx-auto flex flex-col md:flex-row items-center justify-between gap-xl">
<!-- Page Indicator (2 of 3) -->
<div aria-label="Page 2 of 3" class="flex gap-2 items-center order-2 md:order-1">
<div class="w-2 h-2 rounded-full bg-surface-dim transition-colors"></div>
<div class="w-8 h-2 rounded-full bg-primary transition-all duration-300"></div>
<div class="w-2 h-2 rounded-full bg-surface-dim transition-colors"></div>
</div>
<!-- Primary Action -->
<button class="w-full md:w-auto flex items-center justify-center gap-2 bg-primary text-on-primary px-xl py-4 rounded-full font-label-bold text-label-bold hover:bg-surface-tint active:scale-98 transition-all shadow-[0_4px_12px_rgba(0,76,34,0.15)] order-1 md:order-2 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
                Next
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</footer>
<script>
        // Simple script to toggle visibility of the abstract card content in sync with CSS animation
        document.addEventListener('DOMContentLoaded', () => {
            const cardContent = document.getElementById('card-content');
            
            setInterval(() => {
                // Approximate timing to match the morphing CSS animation
                setTimeout(() => {
                    cardContent.style.opacity = '1';
                }, 1500); // Wait for expand
                
                setTimeout(() => {
                    cardContent.style.opacity = '0';
                }, 4500); // Hide before shrink
            }, 6000); // Total animation cycle
        });
    </script>
</body></html>
