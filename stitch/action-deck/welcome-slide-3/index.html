<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Welcome - Slide 3</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "outline-variant": "#bfc9bd",
                        "surface-container-high": "#ebe8e5",
                        "tertiary-fixed-dim": "#ffb2bb",
                        "surface-dim": "#dcd9d7",

                        "surface-container-highest": "#e5e2e0",
                        "surface-variant": "#e5e2e0",
                        "tertiary-fixed": "#ffd9dd",
                        "tertiary-container": "#8f3e4c",
                        "primary-fixed": "#a6f4b5",
                        "secondary-container": "#fe932c",
                        "inverse-surface": "#31302f",
                        "secondary-fixed-dim": "#ffb77d",
                        "primary-container": "#166534",
                        "on-surface-variant": "#404940",
                        "error-container": "#ffdad6",
                        "surface": "#fcf9f6",
                        "primary": "#004c22",
                        "on-secondary-fixed": "#2f1500",
                        "on-primary-container": "#93e0a2",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#ffbfc6",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#1f6c3a",
                        "on-secondary-fixed-variant": "#6e3900",
                        "tertiary": "#722736",
                        "on-tertiary-fixed-variant": "#792d3b",
                        "surface-container-low": "#f6f3f1",
                        "on-surface": "#1c1c1a",
                        "secondary-fixed": "#ffdcc3",
                        "secondary": "#904d00",
                        "surface-bright": "#fcf9f6",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-background": "#1c1c1a",
                        "inverse-primary": "#8bd79b",
                        "on-secondary-container": "#663500",
                        "inverse-on-surface": "#f3f0ee",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#3f0112",
                        "background": "#fcf9f6",
                        "primary-fixed-dim": "#8bd79b",
                        "on-primary-fixed-variant": "#005226",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#00210b",
                        "outline": "#707a6f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "margin-mobile": "20px",
                        "md": "16px",
                        "sm": "8px",
                        "gutter": "16px",
                        "base": "4px",
                        "lg": "24px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "body-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-xl": ["Hanken Grotesk"],
                        "label-sm": ["Hanken Grotesk"],
                        "label-bold": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "800" }],
                        "headline-lg": ["32px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-xl": ["40px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-full flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container overflow-hidden md:hidden">
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative px-margin-mobile pt-12 pb-8 h-full">
<!-- Skip Button (Optional, common in onbaording) -->
<div class="flex justify-end mb-8">
<button class="font-label-bold text-label-bold text-on-surface-variant px-4 py-2 hover:bg-surface-container-low rounded-full transition-colors">
                Skip
            </button>
</div>
<!-- Visual / Illustration Area -->
<div class="flex-1 flex flex-col items-center justify-center relative min-h-[300px] w-full max-w-sm mx-auto mb-8">
<!-- Abstract Background Decoration -->
<div class="absolute inset-0 bg-primary/5 rounded-full blur-3xl opacity-60"></div>
<!-- Bento-style abstracted representation -->
<div class="relative w-full max-w-[280px] h-[320px] mx-auto">
<!-- Group Chat Bubble 1 -->
<div class="absolute top-[10%] left-0 bg-surface-container-high p-4 rounded-2xl rounded-tl-sm shadow-[0_8px_20px_rgba(0,0,0,0.06)] flex items-start gap-3 w-[85%] z-10">
<div class="w-8 h-8 rounded-full bg-secondary-container flex-shrink-0 flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container text-sm">person</span>
</div>
<div class="flex-1 space-y-2">
<div class="h-2 bg-outline-variant/30 rounded w-3/4"></div>
<div class="h-2 bg-outline-variant/30 rounded w-1/2"></div>
</div>
</div>
<!-- Group Chat Bubble 2 (User) -->
<div class="absolute top-[35%] right-0 bg-primary-container p-4 rounded-2xl rounded-tr-sm shadow-[0_8px_20px_rgba(0,40,20,0.1)] flex items-start gap-3 w-[80%] z-20">
<div class="flex-1 space-y-2 flex flex-col items-end">
<div class="h-2 bg-on-primary-container/40 rounded w-full"></div>
<div class="h-2 bg-on-primary-container/40 rounded w-2/3"></div>
</div>
</div>
<!-- Calendar / Plan Card -->
<div class="absolute bottom-[10%] left-[10%] bg-surface-container-lowest p-5 rounded-2xl shadow-[0_12px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20 flex flex-col gap-4 w-[90%] z-30">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary fill">event</span>
</div>
<div>
<div class="h-3 bg-on-surface rounded w-24 mb-1"></div>
<div class="h-2 bg-on-surface-variant rounded w-16"></div>
</div>
</div>
<div class="flex -space-x-2">
<div class="w-6 h-6 rounded-full bg-secondary-container border-2 border-surface-container-lowest"></div>
<div class="w-6 h-6 rounded-full bg-tertiary-container border-2 border-surface-container-lowest"></div>
<div class="w-6 h-6 rounded-full bg-primary-container border-2 border-surface-container-lowest flex items-center justify-center">
<span class="text-[8px] font-label-bold text-on-primary-container">+3</span>
</div>
</div>
</div>
</div>
</div>
<!-- Text Content -->
<div class="text-center mb-auto">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-4">
                Turn "I should do that" into an actual plan.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant px-2">
                Coordinate through group chat, manage attendance, and form recurring groups.
            </p>
</div>
<!-- Navigation & Action -->
<div class="mt-8 flex flex-col items-center gap-8 pb-4">
<!-- Page Indicators -->
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-outline-variant/40"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant/40"></div>
<div class="w-6 h-2 rounded-full bg-primary transition-all duration-300"></div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary h-14 rounded-full font-label-bold text-label-bold flex items-center justify-center shadow-sm hover:scale-[0.98] transition-transform duration-200 active:bg-surface-tint">
                Get started
            </button>
</div>
</main>
</body></html>
