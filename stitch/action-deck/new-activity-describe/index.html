<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Activity - Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-secondary-container": "#663500",
                        "surface-container-lowest": "#ffffff",

                        "primary-fixed": "#a6f4b5",
                        "surface-container": "#f0edeb",
                        "primary-fixed-dim": "#8bd79b",
                        "secondary": "#904d00",
                        "outline-variant": "#bfc9bd",
                        "surface-variant": "#e5e2e0",
                        "surface": "#fcf9f6",
                        "on-primary-container": "#93e0a2",
                        "surface-bright": "#fcf9f6",
                        "on-secondary-fixed": "#2f1500",
                        "outline": "#707a6f",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "primary-container": "#166534",
                        "surface-dim": "#dcd9d7",
                        "secondary-fixed-dim": "#ffb77d",
                        "secondary-fixed": "#ffdcc3",

                        "tertiary": "#722736",
                        "on-primary-fixed": "#00210b",
                        "tertiary-container": "#8f3e4c",
                        "on-surface-variant": "#404940",
                        "tertiary-fixed-dim": "#ffb2bb",
                        "tertiary-fixed": "#ffd9dd",
                        "inverse-primary": "#8bd79b",
                        "on-primary-fixed-variant": "#005226",
                        "on-background": "#1c1c1a",
                        "on-tertiary-fixed": "#3f0112",
                        "on-secondary": "#ffffff",
                        "primary": "#004c22",
                        "error": "#ba1a1a",
                        "secondary-container": "#fe932c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "sm": "8px",
                        "lg": "24px",
                        "base": "4px",
                        "md": "16px",
                        "xs": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],

                        "label-sm": ["Hanken Grotesk"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md relative overflow-hidden">
<!-- Top Navigation (Transactional, no shell nav for main flow) -->
<header class="w-full top-0 sticky bg-surface flex justify-between items-center px-margin-mobile py-sm z-50">
<button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex space-x-1 items-center">
<div class="w-8 h-1 rounded-full bg-primary"></div>
<div class="w-8 h-1 rounded-full bg-surface-container-highest"></div>
<div class="w-8 h-1 rounded-full bg-surface-container-highest"></div>
</div>
<div class="w-11"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile pt-lg pb-[120px]">
<!-- Animated Background Element (Subtle, energetic) -->
<div class="absolute top-0 right-0 w-64 h-64 bg-secondary-fixed rounded-full mix-blend-multiply filter blur-3xl opacity-20 -z-10 translate-x-1/2 -translate-y-1/2"></div>
<div class="absolute bottom-1/4 left-0 w-80 h-80 bg-primary-fixed rounded-full mix-blend-multiply filter blur-3xl opacity-20 -z-10 -translate-x-1/2"></div>
<div class="max-w-2xl mx-auto w-full flex flex-col h-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-xl">
                What do you want to do?
            </h1>
<!-- Large Text Area -->
<div class="relative w-full mb-xl">
<textarea class="w-full bg-transparent border-0 border-b-2 border-surface-dim focus:border-primary focus:ring-0 text-headline-md font-headline-md text-on-surface placeholder:text-outline-variant resize-none h-32 py-md transition-colors" id="activityInput" placeholder="Describe it in your own words..."></textarea>
<div class="absolute bottom-4 right-4 text-outline-variant">
<span class="material-symbols-outlined">edit</span>
</div>
</div>
<!-- Suggestions Section -->
<div class="mt-auto">
<p class="font-label-bold text-label-bold text-on-surface-variant mb-md">Or try a suggestion:</p>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-sm bg-primary/10 hover:bg-primary/20 text-on-primary-container rounded-full font-label-bold text-label-bold transition-colors active:scale-95 duration-100 border border-primary/20 suggestion-chip">
                        Padel tomorrow evening
                    </button>
<button class="px-md py-sm bg-secondary/10 hover:bg-secondary/20 text-on-secondary-container rounded-full font-label-bold text-label-bold transition-colors active:scale-95 duration-100 border border-secondary/20 suggestion-chip">
                        Start a monthly board-game night
                    </button>
<button class="px-md py-sm bg-primary/10 hover:bg-primary/20 text-on-primary-container rounded-full font-label-bold text-label-bold transition-colors active:scale-95 duration-100 border border-primary/20 suggestion-chip">
                        Sunday hike
                    </button>
</div>
</div>
</div>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md pb-safe px-margin-mobile py-lg shadow-[0_-4px_12px_rgba(0,0,0,0.04)] z-40 border-t border-surface-container">
<div class="max-w-2xl mx-auto flex justify-end items-center">
<button class="w-full md:w-auto px-xl py-md bg-primary text-on-primary rounded-full font-headline-md text-headline-md flex items-center justify-center gap-sm hover:bg-primary-container active:scale-95 transition-all duration-200 shadow-lg shadow-primary/20">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
<script>
        // Simple interaction for chips to populate textarea
        document.querySelectorAll('.suggestion-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                const textarea = document.getElementById('activityInput');
                textarea.value = this.textContent.trim();
                textarea.focus();
                
                // Add a small visual pop to the button when active
                const btn = document.querySelector('.fixed.bottom-0 button');
                btn.classList.add('scale-105');
                setTimeout(() => btn.classList.remove('scale-105'), 200);
            });
        });
    </script>
</body></html>
