<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .code-input {
            width: 48px;
            height: 56px;
            text-align: center;
            border: none;
            border-bottom: 2px solid theme('colors.outline-variant');
            background-color: transparent;
            font-size: 24px;
            font-weight: 700;
            color: theme('colors.on-background');
            transition: all 0.2s ease;
            outline: none;
        }

        .code-input:focus {
            border-bottom-color: theme('colors.primary');
            background-color: rgba(0, 76, 34, 0.05); /* Tinted background */
        }
        
        /* Remove arrows from number input */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Top Navigation Container (Suppressed global nav due to linear/transactional intent) -->
<div class="fixed top-0 w-full flex justify-between items-center px-margin-mobile py-sm bg-surface z-50">
<button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md flex flex-col items-center text-center mt-16 md:mt-0">
<!-- Icon / Graphic indicator -->
<div class="mb-lg w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center text-primary shadow-[0_4px_12px_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">lock_open</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-sm">
            Enter the code
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">
            We sent a verification code to<br>
<strong class="font-headline-md text-headline-md text-on-background mt-sm inline-block">+1 555-0123</strong>
</p>
<!-- Code Input Group -->
<form class="flex gap-sm mb-xl" id="verification-form">
<input aria-label="Digit 1" autofocus="" class="code-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
<input aria-label="Digit 2" class="code-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
<input aria-label="Digit 3" class="code-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
<input aria-label="Digit 4" class="code-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
<input aria-label="Digit 5" class="code-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
<input aria-label="Digit 6" class="code-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number">
</form>
<!-- Resend Action -->
<div class="flex flex-col items-center gap-sm">
<p class="font-label-sm text-label-sm text-on-surface-variant" id="countdown-text">
                Resend in <span class="font-label-bold text-label-bold">0:45</span>
</p>
<button class="font-label-bold text-label-bold text-primary opacity-50 cursor-not-allowed hidden" id="resend-btn">
                Resend Code
            </button>
</div>
</main>
<!-- Floating Action Button suppressed as per rules for Transactional screens -->
<!-- Bottom Navigation Shell suppressed as per rules for Transactional screens -->
<script>
        // Micro-interaction for code input auto-advance
        const inputs = document.querySelectorAll('.code-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Ensure only one character
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                
                // Move to next input if filled
                if (e.target.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                
                // Check if all filled to simulate auto-submit (visual cue)
                const allFilled = Array.from(inputs).every(inp => inp.value !== '');
                if (allFilled) {
                    inputs.forEach(inp => {
                        inp.style.borderColor = 'theme("colors.primary")';
                        inp.style.color = 'theme("colors.primary")';
                    });
                } else {
                    // Reset if someone deletes a character
                     inputs.forEach(inp => {
                        inp.style.color = '';
                    });
                }
            });

            input.addEventListener('keydown', (e) => {
                // Handle backspace navigation
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
             input.addEventListener('focus', (e) => {
                 // Select text on focus for easier overwriting
                e.target.select();
             })
        });
        
        // Simple mock countdown
        let timeLeft = 45;
        const countdownEl = document.querySelector('#countdown-text span');
        const resendBtn = document.getElementById('resend-btn');
        const countdownContainer = document.getElementById('countdown-text');
        
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft < 0) {
                clearInterval(timer);
                countdownContainer.classList.add('hidden');
                resendBtn.classList.remove('hidden', 'opacity-50', 'cursor-not-allowed');
                resendBtn.classList.add('hover:underline', 'active:scale-95', 'transition-transform');
            } else {
                const seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                countdownEl.textContent = '0:' + seconds;
            }
        }, 1000);
        
    </script>
</body></html>
