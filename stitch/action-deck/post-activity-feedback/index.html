<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Activity Feedback</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration (Design System) -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-container": "#fe932c",
                    "surface-container-high": "#ebe8e5",
                    "on-secondary": "#ffffff",
                    "primary-fixed-dim": "#8bd79b",
                    "surface-bright": "#fcf9f6",
                    "on-primary": "#ffffff",
                    "on-primary-fixed": "#00210b",
                    "on-surface": "#1c1c1a",
                    "on-secondary-container": "#663500",
                    "outline": "#707a6f",
                    "tertiary-fixed-dim": "#ffb2bb",
                    "inverse-primary": "#8bd79b",
                    "surface-container-highest": "#e5e2e0",
                    "background": "#fcf9f6",
                    "primary-container": "#166534",
                    "secondary-fixed": "#ffdcc3",
                    "tertiary": "#722736",
                    "on-tertiary-fixed": "#3f0112",
                    "surface": "#fcf9f6",
                    "on-tertiary-fixed-variant": "#792d3b",
                    "surface-tint": "#1f6c3a",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#f6f3f1",
                    "primary-fixed": "#a6f4b5",
                    "on-error": "#ffffff",
                    "on-error-container": "#93000a",
                    "primary": "#004c22",
                    "secondary-fixed-dim": "#ffb77d",
                    "secondary": "#904d00",
                    "inverse-on-surface": "#f3f0ee",
                    "tertiary-fixed": "#ffd9dd",
                    "inverse-surface": "#31302f",
                    "on-secondary-fixed-variant": "#6e3900",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed-variant": "#005226",
                    "on-tertiary-container": "#ffbfc6",
                    "surface-variant": "#e5e2e0",
                    "tertiary-container": "#8f3e4c",
                    "surface-container": "#f0edeb",
                    "on-surface-variant": "#404940",
                    "surface-dim": "#dcd9d7",
                    "error": "#ba1a1a",
                    "on-background": "#1c1c1a",
                    "outline-variant": "#bfc9bd",
                    "on-primary-container": "#93e0a2",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed": "#2f1500"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "16px",
                    "lg": "24px",
                    "sm": "8px",
                    "md": "16px",
                    "xs": "4px",
                    "base": "4px",
                    "margin-mobile": "20px",
                    "xl": "32px",
                    "safe": "env(safe-area-inset-bottom, 24px)"
            },
            "fontFamily": {
                    "headline-xl": ["Hanken Grotesk"],
                    "label-bold": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "label-sm": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "headline-xl": ["40px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "label-bold": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "800"}],
                    "headline-lg": ["32px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap');
        
        body {
            -webkit-tap-highlight-color: transparent;
        }

        /* Ambient Shadows matching design system */
        .shadow-ambient {
            box-shadow: 0 16px 32px rgba(28, 28, 26, 0.04), 0 4px 12px rgba(28, 28, 26, 0.02);
        }
        
        .shadow-ambient-press {
            box-shadow: 0 4px 12px rgba(28, 28, 26, 0.06);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md h-screen flex flex-col overflow-x-hidden antialiased">
<!-- 
      TRANSACTIONAL SCREEN LOGIC APPLIED:
      Navigation shell (TopAppBar & BottomNavBar) is suppressed because this is a 
      linear, post-activity feedback screen (a "dead end" relative to global nav).
      A localized, task-focused header is used instead.
    -->
<header class="flex justify-between items-center px-margin-mobile py-md sticky top-0 bg-background/80 backdrop-blur-md z-40">
<div class="w-12"></div> <!-- Spacer for center alignment -->
<h1 class="font-headline-md text-headline-md text-center flex-1 text-on-surface">Feedback</h1>
<button class="w-12 text-right font-label-bold text-label-bold text-primary hover:text-primary-container transition-colors p-sm -mr-sm rounded-full">
            Skip
        </button>
</header>
<main class="flex-1 flex flex-col px-margin-mobile py-lg gap-xl max-w-lg w-full mx-auto overflow-y-auto">
<!-- Sentiment Section -->
<section class="flex flex-col items-center text-center gap-lg mt-md">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface max-w-[280px]">
                Did the activity happen as planned?
            </h2>
<div class="flex justify-center gap-md w-full">
<!-- Disappointed -->
<button class="sentiment-btn group flex-1 max-w-[100px] aspect-square rounded-[20px] flex flex-col items-center justify-center gap-sm bg-surface-container-low border-[1.5px] border-transparent hover:bg-surface-container transition-all active:scale-[0.96] shadow-sm">
<span class="material-symbols-outlined text-[36px] text-on-surface-variant transition-colors group-data-[state=active]:text-primary" data-icon="sentiment_dissatisfied">sentiment_dissatisfied</span>
<span class="font-label-sm text-label-sm text-on-surface-variant transition-colors group-data-[state=active]:text-primary">Not really</span>
</button>
<!-- Neutral -->
<button class="sentiment-btn group flex-1 max-w-[100px] aspect-square rounded-[20px] flex flex-col items-center justify-center gap-sm bg-surface-container-low border-[1.5px] border-transparent hover:bg-surface-container transition-all active:scale-[0.96] shadow-sm">
<span class="material-symbols-outlined text-[36px] text-on-surface-variant transition-colors group-data-[state=active]:text-primary" data-icon="sentiment_neutral">sentiment_neutral</span>
<span class="font-label-sm text-label-sm text-on-surface-variant transition-colors group-data-[state=active]:text-primary">Mostly</span>
</button>
<!-- Satisfied -->
<button class="sentiment-btn group flex-1 max-w-[100px] aspect-square rounded-[20px] flex flex-col items-center justify-center gap-sm bg-surface-container-low border-[1.5px] border-transparent hover:bg-surface-container transition-all active:scale-[0.96] shadow-sm">
<span class="material-symbols-outlined text-[36px] text-on-surface-variant transition-colors group-data-[state=active]:text-primary" data-icon="sentiment_satisfied">sentiment_satisfied</span>
<span class="font-label-sm text-label-sm text-on-surface-variant transition-colors group-data-[state=active]:text-primary">Perfectly</span>
</button>
</div>
</section>
<!-- Comments Section -->
<section class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="feedback-comment">
                Add a comment (optional)
            </label>
<div class="relative bg-surface-container-lowest rounded-xl overflow-hidden border border-outline-variant focus-within:border-primary transition-colors shadow-sm">
<textarea class="w-full bg-transparent border-none p-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0 resize-none block" id="feedback-comment" placeholder="Tell us what went well or what could be better..." rows="3"></textarea>
<!-- Stylistic bottom accent on focus -->
<div class="absolute bottom-0 left-0 w-full h-[2px] bg-primary scale-x-0 origin-left transition-transform duration-300 peer-focus:scale-x-100"></div>
</div>
</section>
<!-- Suggestion Card (Bento-style layout) -->
<section class="bg-surface-container-lowest rounded-[24px] p-lg shadow-ambient border border-surface-container-high relative overflow-hidden flex flex-col gap-md mt-sm">
<!-- Subtle decorative background blob -->
<div class="absolute -top-12 -right-12 w-40 h-40 bg-secondary-container opacity-20 rounded-full blur-3xl pointer-events-none"></div>
<div class="flex items-start gap-md relative z-10">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center shrink-0 shadow-sm">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="group_add">group_add</span>
</div>
<div class="flex flex-col gap-xs pt-1">
<h3 class="font-headline-md text-headline-md text-on-surface leading-tight">Keep the momentum</h3>
<p class="font-body-md text-body-md text-on-surface-variant leading-snug">Repeat this activity with the exact same group next week.</p>
</div>
</div>
<button class="w-full mt-sm py-md px-md rounded-xl border-[1.5px] border-outline text-on-surface font-label-bold text-label-bold hover:bg-surface-container-low active:bg-surface-container transition-all active:scale-[0.98] relative z-10 flex justify-center items-center gap-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="event_repeat">event_repeat</span>
                Create Recurring
            </button>
</section>
<!-- Flexible spacer to push button to bottom if screen is tall -->
<div class="flex-1 min-h-[32px]"></div>
<!-- Primary Action -->
<div class="pb-safe pt-md sticky bottom-0 bg-gradient-to-t from-background via-background to-transparent z-40">
<button class="w-full bg-primary text-on-primary font-label-bold text-label-bold py-[18px] rounded-full shadow-[0_8px_20px_rgba(0,76,34,0.15)] hover:bg-on-primary-fixed-variant active:scale-[0.98] active:shadow-ambient-press transition-all flex justify-center items-center gap-sm">
                Submit Feedback
                <span class="material-symbols-outlined text-[20px]" data-icon="check_circle">check_circle</span>
</button>
</div>
</main>
<script>
        // Micro-interactions for Sentiment Selection
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.sentiment-btn');
            
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Reset all
                    buttons.forEach(b => {
                        b.setAttribute('data-state', 'inactive');
                        b.classList.remove('border-primary', 'bg-primary-fixed', 'bg-opacity-20');
                        b.classList.add('border-transparent', 'bg-surface-container-low');
                    });
                    
                    // Set active state for clicked button
                    btn.setAttribute('data-state', 'active');
                    btn.classList.remove('border-transparent', 'bg-surface-container-low');
                    // Applying tactical styling for active state based on design tokens
                    btn.classList.add('border-primary', 'bg-surface-container-highest');
                });
            });

            // Textarea styling interaction (vanilla JS alternative to complex peer-focus)
            const textarea = document.getElementById('feedback-comment');
            const textareaContainer = textarea.parentElement;

            textarea.addEventListener('focus', () => {
                textareaContainer.classList.add('border-primary');
                textareaContainer.classList.remove('border-outline-variant');
            });

            textarea.addEventListener('blur', () => {
                textareaContainer.classList.remove('border-primary');
                textareaContainer.classList.add('border-outline-variant');
            });
        });
    </script>
</body></html>
