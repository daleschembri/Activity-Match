<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
        }
        
        .interest-tile {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .interest-tile:active {
            transform: scale(0.96);
        }
        
        .interest-tile.selected {
            border-color: theme('colors.primary');
            background-color: theme('colors.primary-container');
            color: theme('colors.on-primary-container');
        }
        
        .interest-tile.selected .icon-container {
            color: theme('colors.primary');
            background-color: theme('colors.on-primary');
        }

        .interest-tile.selected .check-icon {
            opacity: 1;
            transform: scale(1);
        }

        .check-icon {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            display: none;
        }

<script>
        // Simple toggle logic for demonstration
        document.querySelectorAll('.interest-tile').forEach(tile => {
            tile.addEventListener('click', () => {
                tile.classList.toggle('selected');
                const icon = tile.querySelector('.icon-container .material-symbols-outlined');
                
                // Toggle fill state for selected items
                if(tile.classList.contains('selected')){
                     icon.style.fontVariationSettings = "'FILL' 1";
                } else {
                     icon.style.fontVariationSettings = "'FILL' 0";
                }

                // Update button text logic (mock)
                const selectedCount = document.querySelectorAll('.interest-tile.selected').length;
                const btn = document.querySelector('.fixed.bottom-0 button');
                if(selectedCount > 0) {
                    btn.textContent = `Continue (${selectedCount} selected)`;
                    btn.style.opacity = '1';
                    btn.disabled = false;
                } else {
                    btn.textContent = 'Select at least one';
                    btn.style.opacity = '0.5';
                    btn.disabled = true;
                }
            });
        });
    </script>
