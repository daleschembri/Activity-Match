<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Attendance Confirmed</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&amp;display=swap" rel="stylesheet">

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed": "#3f0112",

                    "tertiary": "#722736",
                    "error": "#ba1a1a",
                    "on-secondary-fixed": "#2f1500",
                    "tertiary-fixed": "#ffd9dd",
                    "on-primary-fixed-variant": "#005226",
                    "on-error-container": "#93000a",
                    "surface-variant": "#e5e2e0",
                    "primary-fixed-dim": "#8bd79b",
                    "primary-container": "#166534",
                    "inverse-on-surface": "#f3f0ee",
                    "secondary": "#904d00",
                    "primary-fixed": "#a6f4b5",
                    "secondary-fixed": "#ffdcc3",
                    "surface-container-highest": "#e5e2e0",
                    "inverse-surface": "#31302f",
                    "secondary-container": "#fe932c",
                    "on-background": "#1c1c1a",
                    "outline": "#707a6f",
                    "on-secondary-container": "#663500",
                    "on-secondary-fixed-variant": "#6e3900",
                    "outline-variant": "#bfc9bd",
                    "primary": "#004c22",
                    "on-secondary": "#ffffff",
                    "on-error": "#ffffff",
                    "on-primary": "#ffffff",
                    "surface-dim": "#dcd9d7",
                    "surface-bright": "#fcf9f6",
                    "error-container": "#ffdad6",
                    "surface-container": "#f0edeb",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#00210b",
                    "surface-container-high": "#ebe8e5",
                    "on-surface": "#1c1c1a",
                    "inverse-primary": "#8bd79b",
                    "on-tertiary-container": "#ffbfc6",
                    "on-primary-container": "#93e0a2",
                    "secondary-fixed-dim": "#ffb77d",
                    "surface-tint": "#1f6c3a",
                    "surface": "#fcf9f6"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "20px",
                    "base": "4px",
                    "xl": "32px",
                    "xs": "4px",
                    "md": "16px",
                    "sm": "8px",
                    "gutter": "16px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "headline-lg": ["Hanken Grotesk"],
                    "headline-xl": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"],
                    "label-sm": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "label-bold": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "headline-xl": ["40px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800"}],

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto flex flex-col gap-xl">
<!-- Confirmation Header -->
<div class="flex flex-col items-center text-center gap-md">
<div class="w-16 h-16 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-sm shadow-[0_12px_20px_rgba(0,0,0,0.06)]">
<span class="material-symbols-outlined text-headline-xl font-headline-xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background">Attendance Saved</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">6 of 7 marked as attended</p>
</div>
<!-- Suggestion Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-[0_8px_16px_rgba(0,0,0,0.04)] border border-surface-variant flex flex-col gap-md transform transition-transform hover:scale-[0.99] active:scale-[0.98]">
<div class="flex items-start gap-md">
<div class="w-12 h-12 rounded-lg bg-surface-container-low flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">event_repeat</span>
</div>
<div class="flex flex-col gap-xs">
<h2 class="font-headline-md text-headline-md text-on-surface">Want to do this again?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sunset walk and coffee</p>
<div class="inline-flex items-center gap-xs mt-xs">
<span class="material-symbols-outlined text-label-sm text-outline">calendar_today</span>
<span class="font-label-sm text-label-sm text-outline">Suggested: Sat, Oct 21</span>
</div>
</div>
</div>
<div class="flex flex-col gap-sm mt-sm">
<button class="w-full h-12 bg-primary text-on-primary font-label-bold text-label-bold rounded-lg flex items-center justify-center gap-sm hover:bg-primary-container transition-colors active:scale-95 shadow-[0_4px_12px_rgba(0,76,34,0.15)]">
                    Set up the next one
                </button>
</div>
</div>
<!-- Secondary Action -->
<div class="flex justify-center">
<button class="font-label-bold text-label-bold text-outline hover:text-on-surface transition-colors py-sm px-md">
                Not right now
            </button>
</div>
</main>
</body></html>
